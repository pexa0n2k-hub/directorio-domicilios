<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090d16">
  <title>Directorio de Domicilios</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <span class="eyebrow">DIRECTORIO</span>
      <h1>Mis domicilios</h1>
    </div>
    <button class="icon-button" aria-label="Configuración">⚙️</button>
  </header>

  <main class="container">
    <div class="search-box">
      <span>⌕</span>
      <input id="searchInput" type="search" placeholder="Buscar nombre, dirección o teléfono..." autocomplete="off">
    </div>

    <section class="stats">
      <div class="stat-card house-stat">
        <span class="stat-icon">🏠</span>
        <strong id="houseCount">0</strong>
        <small>Casas</small>
      </div>
      <div class="stat-card apartment-stat">
        <span class="stat-icon">🏢</span>
        <strong id="apartmentCount">0</strong>
        <small>Departamentos</small>
      </div>
    </section>

    <section class="section-header">
      <div>
        <span class="eyebrow">MI BASE</span>
        <h2>Domicilios</h2>
      </div>
      <span id="totalCount">0 registros</span>
    </section>

    <section id="directoryList" class="directory-list"></section>
  </main>

  <button id="addButton" class="floating-button" aria-label="Agregar domicilio">＋</button>

  <div id="modal" class="modal hidden">
    <div class="modal-backdrop" id="modalBackdrop"></div>
    <section class="modal-card">
      <div class="modal-header">
        <div>
          <span class="eyebrow">NUEVO REGISTRO</span>
          <h2>Agregar domicilio</h2>
        </div>
        <button id="closeModal" class="close-button">×</button>
      </div>

      <form id="domicilioForm">
        <label>Tipo de domicilio</label>
        <div class="type-selector">
          <label class="type-option house-option">
            <input type="radio" name="tipo" value="casa" checked>
            <span>🏠 Casa</span>
          </label>
          <label class="type-option apartment-option">
            <input type="radio" name="tipo" value="departamento">
            <span>🏢 Departamento</span>
          </label>
        </div>

        <label for="direccion">Dirección principal *</label>
        <input id="direccion" required placeholder="Ej. Calle Tikal Mz 45 Lt 11">

        <label for="direcciones">Direcciones asociadas</label>
        <textarea id="direcciones" rows="2" placeholder="Una por línea. Ej. Mz 455 Lt 20"></textarea>

        <label for="personas">Personas que reciben</label>
        <textarea id="personas" rows="2" placeholder="Salvador&#10;Karen&#10;Nora"></textarea>

        <label for="telefonos">Teléfonos</label>
        <textarea id="telefonos" rows="2" inputmode="tel" placeholder="5530463338&#10;4183290974"></textarea>

        <label for="notas">Notas</label>
        <textarea id="notas" rows="2" placeholder="Perro, tocar fuerte, dejar con vecino..."></textarea>

        <button class="save-button" type="submit">💾 Guardar domicilio</button>
      </form>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
